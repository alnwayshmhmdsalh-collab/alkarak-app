  amjad_aladaileh: "Jordanian politician born in Karak in 1962. Served as Minister of State for Media Affairs (2019-2020), Director of Media and Communication at the Royal Hashemite Court, Royal Advisor for Media and Communication, and Jordan's Ambassador to Turkey.",
  saleh_altarawneh: "His Excellency Judge Saleh Salman Al-Tarawneh, a prominent Jordanian judge. Promoted to the third rank in 2013 as a judge at North Amman Court. In 2022, he served as Head of the Civil Chamber at the State Security Court and was promoted to the first rank. In 2025, he serves as a judge at the Amman Court of First Instance.",
  hamed_alnawaisheh: "Born in 1938. A prominent literary figure, historian, and sheikh. Graduated from Karak High School in 1957. First president of the Southern Mazar Club in the 1980s (1982). A prominent social, cultural, and national figure in Karak.",
  ayesh_alnawaisheh: "Dr. Ayesh Al-Nawaisheh is a prominent Jordanian educational expert and consultant, well-known for his continuous views and analyses on curriculum development, the Tawjihi (general secondary education) system, and educational platforms.",
  zaid_alnawaisheh: "Dr. Zaid Muhammad Al-Nawaisheh serves as Secretary-General of the Ministry of Government Communication in Jordan since 2022. An academic and administrator holding a PhD in Business Administration, former university professor, and member of the Royal Committee for Modernizing the Political System (2021). Awarded the Jordanian State Centennial Medal.",
  ratib_alnawaisheh: "A prominent Jordanian lawyer and founder of Ratib Al-Nawaisheh & Partners Law Firm, specializing in administrative cases and commercial law. His firm was established in 1986 in Karak before its main branch moved to Amman.",
  mustafa_alnawaisheh: "Dr. Mustafa Hammoud Al-Nawaisheh holds a Master's in International Law and a PhD in International Relations and Politics. Member of the Jordanian Jurists Association. Served as Secretary-General of the Legislation and Opinion Bureau at the Prime Ministry from 2015 until September 2019, and held prominent diplomatic positions.",
  salah_alnawaisheh: "A prominent Jordanian legal expert, currently serving as Director of the Legal Affairs Directorate at the Ministry of Water and Irrigation and Head of the Cases and Arbitration Division.",
  naif_alnawaisheh: "Considered the most prominent writer and researcher bearing this name locally in Karak, born in the Southern Mazar in 1947, known for his dedication to Jordanian literature and folk heritage.",
  muhammad_al_maaytah: "Born in Karak in 1912. Joined the Jordanian Arab Army as a candidate officer on November 1, 1938. Served in several prominent positions including military attaché for Jordan in Syria and Lebanon, senior companion of His Majesty the late King Abdullah, military advisor in the Ministry of Defence, and Director of Public Security.",
  muhammad_al_dhanibat: "Muhammad Al-Dhanibat (born 1950 in Karak) is a Jordanian politician who served as Deputy Prime Minister and Minister of Education from October 2012 until January 14, 2017 in the governments of Abdullah Ensour and Hani Al-Mulki. In early 2003 he served as Minister of Administrative Development and Minister of Environment in Ali Abu Al-Ragheb's government.",
  hikmat_alnawaisheh: "Jordanian poet and writer, born on April 15, 1964 in Jordan. Earned a Bachelor's in Education and Geography from the University of Baghdad (1987), a Bachelor's in Arabic Literature from Mu'tah University (1996), a Diploma in Education (1998), and a Master's (2007) and PhD (2012) in Arabic Literature from the University of Jordan. Member of the Jordanian Writers Association and the General Union of Arab Writers, Editor-in-Chief of the Popular Arts magazine at the Ministry of Culture, co-founder of the Arab House of Culture and Civilizational Communication (Bayt Al-Anbat) and the Karak Cultural Forum, member of the Criticism and Poetry Committee of the Jerash Festival (2001-2006), and Editor-in-Chief of the Sama magazine for children.",
  ekhleif_altarawneh: "Jordanian academic and administrator born in the Southern Mazar, Karak Governorate. Earned his PhD in Educational Administration from the University of Kansas in 1992, and his Master's and Educational Specialist degrees from Emporia State University. Served as President of Al-Balqa Applied University (2010-2012), then President of the University of Jordan (March 29, 2012 - March 28, 2016), and previously as Dean of a college at Mu'tah University (1999-2000). Authored educational works including 'Knowledge Management in Education' and 'Models and Issues in Higher Education', and writes opinion articles on educational and national affairs.",
  ibrahim_almubaydin: "Born in Karak in 1907, studied the Quran and Arabic under Sheikh Ahmed Al-Dabbagh, then at Karak and Salt schools, and spent four years at Al-Azhar in Cairo. After reciting a poem before Prince Abdullah bin Al-Hussein, he was appointed Royal Revenue Clerk at the Royal Court. Worked in teaching across Amman, Wadi Musa, Shoubak, Tafileh, Ma'an and Karak, then at the Ministries of Finance and Interior until his retirement in 1962, and joined Jordan Radio in 1974 until his death in 1982. The Ministry of Culture included him in the Dictionary of Jordanian Writers, and a book 'Ibrahim Al-Mubaydin: His Life and Poetry' was published about him.",
  ibrahim_yusuf_altarawneh: "Born in 1966 in Al-Khalidiya, Karak. Earned a Bachelor's in Dentistry from Yass University in Romania in 1990 and served as a dentist in the Royal Medical Services, reaching the rank of Captain (1991-1998). Founded the Specialist Dental Center and became its General Director in 1999, served as President of the Jordanian Dental Association for two consecutive terms (2013-2019), and as Assistant Secretary-General of the Arab Dental Federation (2013-2016). Appointed to the 29th Senate then resigned on July 8, 2024, and won a parliamentary seat for Karak in the 2024 elections with 10,925 votes.",
  tawfiq_al_majali: "Born in Karak around 1880 into a family of Majali sheikhs. Educated at Karak School and the Anbar Office in Damascus, and mastered Turkish. Considered the first MP from Karak and Jordan in the Ottoman Parliament, representing the Karak District in the 1908-1912 and 1914 sessions. During the 1910 Karak Revolt he carried the demands and grievances of Karak's people to the Parliament and protested against conscription, census and taxes. Persecuted for his criticism, he fled to Cairo. He later headed Karak Municipality for three years and served as assistant to the Karak Governor under the Faisali government. Died around 1920.",
  dalwan_al_majali: "A sheikh and notable of the Al-Majali clan, he headed Karak Municipality for about 58 consecutive years, among the longest recorded municipal tenures. Known as a social reformer and tribal judge, his house and majlis in central Karak were a gathering place where many disputes were resolved. He was among those who welcomed Prince Abdullah bin Al-Hussein on his arrival to Jordan, known for generosity and chivalry, and was a Nabati poet and horseman interested in Arabian horses. Died on October 10, 1979; sources differ on his birth year.",
  riyad_alnawaisheh: "A son of Karak, formerly a physician and now a lawyer, political and human rights activist, and former MP. Associated with the popular movement in Karak, he took part in many political and reform activities and was among the victims of the April 1989 events, later speaking about his experience. Appeared in political lectures and seminars in Karak and Amman addressing political and economic reform and the Palestinian cause, and worked as a legal consultant.",
  saher_al_maaytah: "One of the most prominent sheikhs of the Maaytah clans in Karak, he participated in leading the 1910 Karak Revolt (Al-Hiyyah) against Ottoman rule alongside Sheikh Qadr bin Saleh Al-Majali and other Karak sheikhs, protesting taxes, conscription and census. After the revolt was suppressed, the Ottoman authorities arrested him and he was transferred to Damascus where he was executed by hanging. Local tribal accounts also narrate that he surrendered himself in exchange for sparing his clan, a transmitted account rather than independently documented fact.",
  samih_al_maaytah: "Born in 1965. Served as Minister of State for Media Affairs and Minister of Culture (2012-2013), Minister of State for Media Affairs and Communications in 2012, political advisor to the Prime Minister, and official spokesperson for the 2010 parliamentary elections. Winner of the Hussein Prize for Best Journalistic Article in 2009, and in October 2017 published a book on the Syrian crisis titled 'Syria... The Black Blood'.",
  thafir_al_saraireh: "Jordanian academic born in 1970, specialist in English and American literature. Earned a Bachelor's in English from Mu'tah University (1991), a Master's from the University of Missouri-Kansas City (1994), and a PhD from Ohio University (1998). Held several positions at Mu'tah University including Dean of the Faculty of Arts, Head of the English Department, Director of the Language Center, and Vice President. Became President of Mu'tah University in 2016, the first president from its graduates, and in 2020 was appointed Chairman of the Accreditation and Quality Assurance Commission for Higher Education Institutions.",
  abdulqadir_bajas_al_majali: "One of the men of Karak and Jordan who shaped history with firm stances. A genuine Bedouin fighter who stood in the trenches defending Palestine and Jerusalem in the 1948 and 1967 wars, present at the Battle of Karameh and in South Lebanon. He is known for the saying: 'As long as there is an occupied Arab country, the rifle is the passport.' He inherited from his father Sheikh Bajas a historic Ottoman rifle over 160 years old and preserved it as a symbol of authenticity and struggle, known for generosity and tribal reconciliation.",
  ali_al_shawara: "One of the historic notables and sheikhs of the Bararsheh clan, renowned in southern Jordan as a tribal judge. Born in 1896.",
  fahd_al_kasasbeh: "Retired Jordanian officer from Public Security, academic and criminal law researcher. Served as Inspector General of Public Security with the rank of Brigadier in 2009, then promoted to Major General and retired at the end of 2009. Previously commanded the Police Sciences College at Mu'tah University (2000-2003). Earned a PhD in law with a thesis on the role of punishment in reforming and rehabilitating offenders, authored 'The Function of Punishment and Its Role in Reform and Rehabilitation: A Comparative Study' (2010), and continued as a faculty member at Amman Arab University.",
  mahmoud_al_nuaimat: "Jordanian politician and lawyer from Karak Governorate, from Dhat Ras and the Nuaimat clans. Born in 1964, earned a law degree from Syria. Elected to the 16th Parliament for Karak, returned in the 18th Parliament (4,812 votes), and is a member of the 20th Parliament (4,220 votes). Was a member of the National Current Party and the Committee on Labor, Social Development and Population, known socially as 'Abu Al-Nemer'.",
  mustafa_al_rawashdah: "Jordanian politician and educator born in Ayy, Karak (August 2, 1963). Holds a Bachelor's in Arts and History (1985), a law degree (1997), and higher diplomas in history and education. Worked as a teacher and school principal, and was the first president of the Jordanian Teachers Association in its first term. Served in the 17th House of Representatives and the 29th Senate and on the Integrity and Anti-Corruption Commission, and has served as Minister of Culture since September 18, 2024, associated with the 'Land and People' national narrative documentation project.",
  musleh_altarawneh: "Born in Karak in 1971. Earned a law degree from Mu'tah University (1993), a Master's in commercial law from Britain (1994) and a PhD in commercial law (1998). Taught commercial law and international commercial arbitration at Mu'tah University holding positions including Deputy Dean of the Faculty of Law and Dean of Student Affairs, and taught at Qatar and Bahrain universities. Served as an international arbitrator and legal consultant and was a member of the London Court of International Arbitration (1997-2002). Elected MP for Karak in the 18th Parliament (6,856 votes), and is currently Vice President of Amman Private University and Dean of its Faculty of Law.",
  yusuf_salim_altarawneh: "From Al-Omariyya in the Southern Mazar district of Karak, born in 1954. Earned a law degree from the University of Baghdad (1979) and joined the judiciary in 1988 as a judge at the Ghor Al-Safi Magistrates Court, then served in Ma'an, Al-Qasr and Tafileh courts. Became President of Ma'an First Instance Court (1999), Public Prosecutor of Ma'an (2002), then judge in the Amman and Ma'an Courts of Appeal. On October 23, 2011 became President of Ma'an Court of Appeal and a member of the Jordanian Judicial Council, raised to the special grade in 2008. Died on August 18, 2014.",
  fares_basha_al_maaytah: "Known as Fares Pasha Al-Maaytah (Abu Nadahtayn), one of the sheikhs and notables of the Maaytah clan in Karak, prominent in the era of the founding of the Jordanian state. Born around 1898 in Adir, Karak, raised in a tribal leadership home; his father was Sheikh Yousef Mustafa Al-Maaytah and his uncle Sheikh Jafar Mustafa Al-Maaytah raised him. Renowned for tribal leadership, generosity, horsemanship and reconciliation, with a social and political presence in Karak.",
  hammad_al_maaytah: "One of the most prominent sheikhs and notables of the Maaytah clans in Karak, born in 1944. Worked at the Ministry of Interior then headed a municipality, served on the Karak Governorate Advisory Council for four terms, and in the Senate for more than one term (1993-1997 and 2012-2016), and the National Consultative Council (1978-1984). Participated in the Agricultural Credit Corporation, Karak Development Corporation and the Faculty of Law Council at Mu'tah University. Chosen in a general meeting of Maaytah sheikhs as head sheikh of the clans and tribal judge, and hosted the visit of Crown Prince Hussein bin Abdullah at his diwan in 2018.",
  mousa_al_hajazeen: "From the village of Al-Samakiyya in Karak Qasaba, born December 14, 1956 (some sources differ on the day). Studied music at Helwan University in Egypt and returned with a degree in music education, teaching music at Orthodox schools. Known to the Jordanian audience through 'Hara Abu Awad', then 'Al-Sharikan' and 'Al-Ilm Noor', famous for the characters 'Sam'a' and 'Abu Saqr'. Presented satirical plays including 'Ila Man Yahummo Al-Amr', 'Zaman Al-Shaklaba', 'Sam'a fi Amrica' and 'Hai Muwatin'. An oud player and singer, former member of the Fuheis Folk Arts Band, awarded the Order of Independence of the Third Class.",
  nidal_al_kharsha: "Jordanian media figure and journalist from the Al-Kharsha clans in Karak, prominent in radio and television. Worked as Director of Media at the Greater Amman Municipality and presented the morning program on Hawa Amman radio, covering national and social issues. Participated in the Jordanian Hajj media mission and was honored by the Ministry of Awqaf in 2018, and served as the media guarantor in the reconciliation delegation for the artist Ruhi Al-Safadi incident.",
  daoud_al_kharsha: "Tribal judge, sheikh and notable of the Al-Kharsha clan in Karak, known for resolving disputes and reconciliation, working for many years in tribal justice and resolving conflicts through traditional means and security and tribal 'Ataawat' (amnesties) in Jordan. Died on Sunday, November 21, 2021, and condolences were conveyed to his clan through the head of the Royal Hashemite Court.",

function WeatherWidget({ lat, lng, lang = "ar" }) {
  const [wx, setWx] = useState(null);
  const [failed, setFailed] = useState(false);
  const t = L[lang];
  const codes = lang === "en" ? WMO_CODES_EN : WMO_CODES;

  useEffect(() => {
    let live = true;
    setWx(null);
    setFailed(false);
    fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`
    )
      .then((r) => r.json())
      .then((j) => {
        if (live) {
          if (j && j.current) setWx(j.current);
          else setFailed(true);
        }
      })
      .catch(() => { if (live) setFailed(true); });
    return () => { live = false; };
  }, [lat, lng]);

  if (failed) {
    return <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13, color: "var(--muted)", margin: 0 }}>{t.weatherFail}</p>;
  }
  if (!wx) {
    return <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13, color: "var(--muted)", margin: 0 }}>{t.weatherLoading}</p>;
  }

  const temp = Math.round(wx.temperature_2m);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
      <div style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 800, fontSize: 34, color: "var(--ink)", lineHeight: 1 }}>{temp}°C</div>
      <div>
        <div style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 14.5, color: "var(--accent)" }}>
          {codes[wx.weather_code] || "?"}
        </div>
        <div style={{ fontFamily: "'Cairo', sans-serif", fontSize: 12, color: "var(--muted)", marginTop: 4 }}>
          {lang === "en" ? "Wind" : "الرياح"} {Math.round(wx.wind_speed_10m)} km/h &bull; {lang === "en" ? "Humidity" : "الرطوبة"} {Math.round(wx.relative_humidity_2m)}%
        </div>
      </div>
    </div>
  );
}

function shade(hex, amt) {
  let h = String(hex || "").trim();
  if (h.indexOf("var(") === 0) {
    try {
      const resolved = getComputedStyle(document.documentElement).getPropertyValue(h.slice(4, -1).trim());
      if (resolved && resolved.trim()) h = resolved.trim();
    } catch {}
  }
  h = h.replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const n = parseInt(full, 16);
  if (isNaN(n)) return "var(--gold)";
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) {
    r = Math.round(r + (255 - r) * amt);
    g = Math.round(g + (255 - g) * amt);
    b = Math.round(b + (255 - b) * amt);
  } else {
    r = Math.round(r * (1 + amt));
    g = Math.round(g * (1 + amt));
    b = Math.round(b * (1 + amt));
  }
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function BottomNav({ active, onNavigate, lang = "ar" }) {
  const t = L[lang];
  const items = [
    { key: "settings", label: t.settings, icon: "settings" },
    { key: "search", label: t.search, icon: "search" },
    { key: "home", label: t.home, icon: "home" },
    { key: "favorites", label: t.favorites, icon: "heart" },
    { key: "map", label: t.map, icon: "map" },
  ];
  const itemRefs = useRef({});
  const [pill, setPill] = useState(null);
  const [hovered, setHovered] = useState(null);

  useEffect(() => {
    const el = itemRefs.current[active];
    if (!el) return;
    const update = () => setPill({ left: el.offsetLeft, width: el.offsetWidth });
    update();
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, [active]);

  return (
    <div
      style={{
        position: "relative",
        display: "flex",
        alignItems: "center",
        margin: "0 12px 12px",
        padding: "6px",
        borderRadius: 26,
        background: "linear-gradient(180deg, #1b2338 0%, #2c3a55 55%, #4a3a25 100%)",
        backdropFilter: "blur(16px)",
        WebkitBackdropFilter: "blur(16px)",
        border: "1px solid rgba(212,168,110,0.55)",
        boxShadow: "0 12px 32px rgba(20,10,4,0.45), inset 0 1px 0 rgba(232,201,138,0.35), inset 0 -1px 0 rgba(0,0,0,0.4)",
      }}
    >
      {pill && (
        <div
          style={{
            position: "absolute",
            top: 6,
            height: 54,
            width: pill.width,
            borderRadius: 20,
            background: "linear-gradient(135deg, #e8b95c 0%, #c08a3c 40%, #8a5a1e 100%)",
            boxShadow: "0 8px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,240,200,0.7), inset 0 -2px 6px rgba(0,0,0,0.25)",
            transform: `translateX(${pill.left}px)`,
            transition: "transform 0.55s cubic-bezier(0.22, 1.28, 0.36, 1)",
            zIndex: 0,
            pointerEvents: "none",
          }}
        />
      )}
      {items.map((it) => {
        const isActive = it.key === active;
  const isHovered = hovered === it.key;
  const iconColor = isActive || isHovered ? "#fff6e0" : "#c9a976";
  const labelColor = isActive || isHovered ? "#fff6e0" : "#c9a976";
        return (
          <div
            key={it.key}
            ref={(el) => { itemRefs.current[it.key] = el; }}
            onClick={() => onNavigate && onNavigate(it.key)}
            onMouseEnter={() => setHovered(it.key)}
            onMouseLeave={() => setHovered(null)}
            style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "8px 0 6px", zIndex: 1, cursor: "pointer", userSelect: "none", position: "relative" }}
          >
            <span
              style={{
                display: "inline-flex",
                transform: isHovered ? "translateY(-3px) scale(1.3)" : isActive ? "translateY(-2px) scale(1.12)" : "translateY(0) scale(1)",
                opacity: isHovered ? 1 : isActive ? 1 : 0.95,
                filter: isHovered ? "drop-shadow(0 0 5px rgba(255,232,190,0.9))" : "none",
                transition: "transform 0.35s cubic-bezier(0.22, 1.5, 0.36, 1), opacity 0.25s ease, filter 0.25s ease",
              }}
            >
              {<Icon name={it.icon} size={22} color={iconColor} />}
            </span>
            <span
              style={{
                fontSize: 11.5,
                color: labelColor,
                fontWeight: isActive ? 800 : 700,
                opacity: 1,
                textShadow: isActive ? "0 1px 3px rgba(0,0,0,0.3)" : "none",
                transition: "color 0.3s ease",
              }}
            >
              {it.label}
            </span>
          </div>
        );
      })}
    </div>
  );
}

        {pick(lang, fg.name, FIGURE_EN, fg.key)}
      </h4>
      <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 10.5, color: "var(--muted)", margin: 0, lineHeight: 1.45 }}>
        {pick(lang, fg.short, FIGURE_SHORT_EN, fg.key)}
      </p>
      {role && (
        <span style={{ marginTop: 6, display: "inline-flex", alignItems: "center", gap: 4, background: "var(--soft)", border: "1px solid #e0c89a", borderRadius: 20, padding: "3px 9px", fontFamily: "'Cairo', sans-serif", fontSize: 10, fontWeight: 600, color: "var(--accent)" }}>
          <Icon name={role.icon} size={11} color="var(--accent)" />
          {lang === "en" ? (FIGURE_ROLES_EN[role.key] || role.label) : role.label}
        </span>
      )}
    </div>
  );
}

function FigureHero({ fg, lang = "ar" }) {
  const role = FIGURE_ROLES.find((r) => r.key === fg.role);
  return (
    <div style={{ position: "relative", width: "100%", height: 250, borderRadius: 16, overflow: "hidden", background: "linear-gradient(180deg, #1b2338 0%, #2c3a55 55%, #4a3a25 100%)", marginBottom: 14, boxShadow: "0 10px 26px rgba(0,0,0,0.35)" }}>
      {/* glow */}
      <div style={{ position: "absolute", top: -30, left: "50%", transform: "translateX(-50%)", width: 240, height: 220, borderRadius: "50%", background: "radial-gradient(circle, rgba(232,201,138,0.35) 0%, rgba(232,201,138,0) 70%)" }} />
      {/* sun */}
      <div className="castle-sun" style={{ position: "absolute", top: 16, left: 22, width: 26, height: 26, borderRadius: "50%", background: "radial-gradient(circle, #ffe9b8 0%, #e8c98a 60%, rgba(232,201,138,0) 75%)", boxShadow: "0 0 26px rgba(232,201,138,0.7)" }} />
      {/* clouds */}
      <div className="castle-cloud" style={{ position: "absolute", top: 30, left: 0, width: 56, height: 15, borderRadius: 20, background: "rgba(255,250,238,0.32)", filter: "blur(2px)" }} />
      <div className="castle-cloud b" style={{ position: "absolute", top: 56, left: 30, width: 80, height: 18, borderRadius: 24, background: "rgba(255,250,238,0.26)", filter: "blur(2.5px)" }} />
      <div className="castle-cloud c" style={{ position: "absolute", top: 16, left: 128, width: 48, height: 12, borderRadius: 18, background: "rgba(255,250,238,0.2)", filter: "blur(2px)" }} />
      {/* birds */}
      <svg className="castle-bird" style={{ position: "absolute", top: 36, left: 0, zIndex: 3 }} width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="#d8cbb0" strokeWidth="1.6" strokeLinecap="round">
        <path d="M2 6 Q5 2 8 6 Q10 3 13 6" />
      </svg>
      <svg className="castle-bird b" style={{ position: "absolute", top: 64, left: 44, zIndex: 3 }} width="14" height="8" viewBox="0 0 20 10" fill="none" stroke="#d8cbb0" strokeWidth="1.5" strokeLinecap="round">
        <path d="M2 6 Q5 2 8 6 Q10 3 13 6" />
      </svg>
      {/* figure icon */}
      <div style={{ position: "absolute", top: 20, left: 0, right: 0, zIndex: 4, textAlign: "center" }}>
        <span className="fig-hero-icon" style={{ filter: "drop-shadow(0 0 10px rgba(232,201,138,0.55))" }}>
          <Icon name={fg.icon} size={42} color="#e8c98a" />
        </span>
      </div>
      {/* name + role */}
      <div style={{ position: "absolute", bottom: "34%", left: 0, right: 0, zIndex: 4, textAlign: "center", padding: "0 14px" }}>
        <span className="fig-hero-name" style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 33, lineHeight: 1.35, display: "block" }}>
          {pick(lang, fg.name, FIGURE_EN, fg.key)}
        </span>
        <span className="fig-hero-chip">
          <Icon name={role.icon} size={12} color="#e8c98a" />
          {lang === "en" ? (FIGURE_ROLES_EN[role.key] || role.label) : role.label}
        </span>
      </div>
    </div>
  );
}

function FigureDetailView({ selected, onBack, onNavigate, lang = "ar" }) {
  const t = L[lang];
  return (
    <div key={selected.key} className="detail-enter" style={{ height: "100%", display: "flex", flexDirection: "column", background: "var(--bg)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "18px 18px 10px" }}>
        <BackButton onClick={onBack} />
        <h2 style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 18, color: "var(--ink)", margin: 0 }}>
          {t.figures}
        </h2>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "10px 18px 18px" }}>
        <FigureHero fg={selected} lang={lang} />

        {selected.era ? (
          <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 12.5, fontWeight: 700, color: "var(--gold)", margin: "0 0 12px" }}>
            {selected.era}
          </p>
        ) : null}

        <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "var(--muted)", margin: 0, lineHeight: 1.9 }}>
          {pick(lang, selected.desc, FIGURE_DESC_EN, selected.key)}
        </p>
      </div>

      <BottomNav active="home" onNavigate={onNavigate} lang={lang} />
    </div>
  );
}

function SuggestionModal({ t, onClose }) {
  const [name, setName] = useState("");
  const [msg, setMsg] = useState("");
  const [status, setStatus] = useState("idle");

  const canSend = msg.trim().length > 0 && status !== "sending";

  const submit = async () => {
    if (!canSend) return;
    setStatus("sending");
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS_SERVICE_ID,
          template_id: EMAILJS_TEMPLATE_ID,
          user_id: EMAILJS_PUBLIC_KEY,
          template_params: {
            from_name: name.trim() || "مستخدم التطبيق",
            message: msg.trim(),
            reply_to: "",
          },
        }),
      });
      if (!res.ok) throw new Error("send failed " + res.status);
      setStatus("done");
    } catch (err) {
      setStatus("error");
      console.error(err);
    }
  };

  return (
    <div style={{ position: "absolute", inset: 0, zIndex: 70, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div className="rate-backdrop" style={{ position: "absolute", inset: 0, background: "rgba(30,20,10,0.5)", backdropFilter: "blur(3px)" }} onClick={onClose} />
      <div className="rate-pop" style={{ position: "relative", width: "100%", maxWidth: 380, background: "var(--panel)", borderRadius: 20, padding: "26px 24px 22px", boxShadow: "0 24px 60px rgba(60,40,20,0.35)", border: "1px solid var(--line)", textAlign: "center" }}>
        {status === "done" ? (
          <div>
            <div style={{ fontSize: 46, lineHeight: 1 }}>✉️</div>
            <h3 style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 24, color: "var(--ink)", margin: "12px 0 6px" }}>{t.suggestSuccess}</h3>
            <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "var(--muted)", margin: "0 0 20px", lineHeight: 1.7 }}>{t.suggestSuccessSub}</p>
            <button onClick={onClose} style={{ background: "var(--accent)", color: "var(--bg)", border: "none", borderRadius: 12, padding: "12px 0", width: "100%", fontFamily: "'Cairo', sans-serif", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>{t.close}</button>
          </div>
        ) : (
          <div>
            <div style={{ width: 56, height: 56, borderRadius: 28, background: "var(--soft)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 12px" }}>
              <Icon name="bulb" size={30} color="var(--gold)" />
            </div>
            <h3 style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 23, color: "var(--ink)", margin: "0 0 6px" }}>{t.suggestTitle}</h3>
            <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "var(--muted)", margin: "0 0 16px", lineHeight: 1.7 }}>{t.suggestPrompt}</p>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder={t.suggestName}
              style={{ width: "100%", background: "var(--soft)", border: "1px solid var(--line)", borderRadius: 12, padding: "12px 14px", fontFamily: "'Cairo', sans-serif", fontSize: 14, color: "var(--ink)", boxSizing: "border-box", outline: "none", marginBottom: 10 }}
            />
            <textarea
              value={msg}
              onChange={(e) => setMsg(e.target.value)}
              placeholder={t.suggestMsg}
              rows={4}
              style={{ width: "100%", background: "var(--soft)", border: "1px solid var(--line)", borderRadius: 12, padding: "12px 14px", fontFamily: "'Cairo', sans-serif", fontSize: 14, color: "var(--ink)", boxSizing: "border-box", outline: "none", resize: "vertical", minHeight: 96, marginBottom: 16 }}
            />
            {status === "error" && (
              <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 12.5, color: "#e05252", margin: "0 0 12px", lineHeight: 1.6 }}>{t.suggestError}</p>
            )}
            <button
              onClick={submit}
              disabled={!canSend}
              style={{ background: canSend ? "var(--accent)" : "#d8cdbb", color: "var(--bg)", border: "none", borderRadius: 12, padding: "12px 0", width: "100%", fontFamily: "'Cairo', sans-serif", fontSize: 14, fontWeight: 700, cursor: canSend ? "pointer" : "default" }}
            >
              {status === "sending" ? t.suggestSending : t.suggestSend}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function CategoriesScreen({ onHome, onOpenCategory, onNavigate, lang = "ar", onToggleLang, dark = false, onToggleDark, onInstall, onSuggest, onLockRequest }) {
  const t = L[lang];
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuClosing, setMenuClosing] = useState(false);
  const [rateOpen, setRateOpen] = useState(false);
  const [infoOpen, setInfoOpen] = useState(null);
  const [hoveredCat, setHoveredCat] = useState(null);
  const [ownerActive, setOwnerActive] = useState(() => {
    try { return localStorage.getItem(OWNER_KEY) === "1"; } catch { return false; }
  });
  const ownerTapRef = useRef(0);
  const [ownerPrompt, setOwnerPrompt] = useState(false);
  const [ownerCode, setOwnerCode] = useState("");
  const [ownerErr, setOwnerErr] = useState(false);

  const handleOwnerTap = () => {
    ownerTapRef.current++;
    if (ownerTapRef.current >= 7) {
      ownerTapRef.current = 0;
      setOwnerPrompt(true);
    }
  };

  const submitOwner = () => {
    if (ownerCode.trim() === OWNER_CODE) {
      try { localStorage.setItem(OWNER_KEY, "1"); } catch {}
      setOwnerActive(true);
      setOwnerPrompt(false);
      setOwnerCode("");
      setOwnerErr(false);
    } else {
      setOwnerErr(true);
    }
  };

  const closeMenu = () => {
    if (menuClosing) return;
    setMenuClosing(true);
    setTimeout(() => { setMenuOpen(false); setMenuClosing(false); }, 260);
  };

  const runMenuAction = (action) => {
    closeMenu();
    setTimeout(action, 120);
  };

  const openRate = () => setRateOpen(true);

  const menuItems = [
    { key: "install", label: t.install, icon: "plus", action: () => onInstall && onInstall() },
    { key: "home", label: t.home, icon: "home", action: onHome },
    { key: "landmarks", label: t.landmarks, icon: "castle", action: () => onOpenCategory("landmarks") },
    { key: "prayer", label: t.prayer, icon: "mosque", action: () => onOpenCategory("prayer") },
    { key: "search", label: t.search, icon: "search", action: () => onNavigate("search") },
    { key: "favorites", label: t.favorites, icon: "heart", action: () => onNavigate("favorites") },
    { key: "map", label: t.map, icon: "map", action: () => onNavigate("map") },
    { key: "settings", label: t.settings, icon: "settings", action: () => onNavigate("settings") },
    { key: "language", label: t.language, icon: "globe", action: () => onToggleLang && onToggleLang(lang === "ar" ? "en" : "ar") },
    { key: "dark", label: t.darkMode, icon: "moon", action: () => onToggleDark && onToggleDark() },
    { key: "rate", label: t.rate, icon: "star", action: openRate },
    { key: "suggest", label: t.suggest, icon: "bulb", action: () => onSuggest && onSuggest() },
    ...(ownerActive ? [{ key: "lock", label: t.lockData, icon: "lock", action: () => onLockRequest && onLockRequest() }] : []),
    { key: "privacy", label: t.privacy, icon: "globe", action: () => setInfoOpen("privacy") },
    { key: "rights", label: t.rights, icon: "info", action: () => setInfoOpen("rights") },
  ];

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: "var(--bg)", position: "relative" }}>
      {/* header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 18px 10px" }}>
        <button
          onClick={() => onToggleDark && onToggleDark()}
          aria-label={t.darkMode}
          style={{ background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex", alignItems: "center", justifyContent: "center" }}
        >
          <Icon name={dark ? "sun" : "moon"} size={22} color="var(--accent)" />
        </button>
        <h2 style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 19, color: "var(--ink)", margin: 0 }}>
          {t.appName}
        </h2>
        <button
          onClick={() => { setMenuClosing(false); setMenuOpen(true); }}
          aria-label="القائمة"
          style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}
        >
          <Icon name="menu" size={22} color="var(--accent)" />
        </button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "6px 18px 4px" }}>
        {/* hero */}
        <CastleHero lang={lang} />

        <h3 style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 16, color: "var(--ink)", margin: "0 0 12px" }}>
          {t.mainSections}
        </h3>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
          {CATEGORIES.map((cat) => {
            const isHov = hoveredCat === cat.key;
            return (
              <button
                key={cat.key}
                onClick={() => onOpenCategory(cat.key)}
                onMouseEnter={() => setHoveredCat(cat.key)}
                onMouseLeave={() => setHoveredCat(null)}
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 10,
                  background: isHov ? "linear-gradient(180deg, rgba(255,220,150,0.16), rgba(255,220,150,0))" : "var(--card)",
                  border: "1px solid " + (isHov ? "rgba(232,201,138,0.6)" : "var(--line)"),
                  borderRadius: 14,
                  padding: "18px 8px",
                  cursor: "pointer",
                  fontFamily: "'Cairo', sans-serif",
                  transition: "background 0.25s ease, border 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease",
                  transform: isHov ? "translateY(-3px)" : "none",
                  boxShadow: isHov ? "0 8px 20px rgba(232,201,138,0.22)" : "none",
                }}
              >
                <span
                  style={{
                    display: "inline-flex",
                    transform: isHov ? "scale(1.32)" : "scale(1)",
                    filter: isHov ? "drop-shadow(0 0 6px rgba(255,232,190,0.85))" : "none",
                    transition: "transform 0.35s cubic-bezier(0.22, 1.5, 0.36, 1), filter 0.25s ease",
                  }}
                >
                  <Icon name={cat.icon} size={26} />
                </span>
                <span style={{ fontSize: 12.5, fontWeight: isHov ? 700 : 600, color: "var(--ink)", lineHeight: 1.3, transition: "color 0.2s ease" }}>{pick(lang, cat.label, CAT_EN, cat.key)}</span>
              </button>
            );
          })}
        </div>
      </div>

      <BottomNav active="home" onNavigate={onNavigate} lang={lang} />

      {rateOpen && (
        <RatingModal t={t} onClose={() => setRateOpen(false)} />
      )}

      {infoOpen && (
        <InfoModal t={t} lang={lang} kind={infoOpen} onClose={() => setInfoOpen(null)} />
      )}

      {menuOpen && (
        <div
          style={{ position: "absolute", inset: 0, zIndex: 50, display: "flex" }}
          onClick={closeMenu}
        >
          <div
            className={menuClosing ? "menu-backdrop-exit" : "menu-backdrop-enter"}
            style={{ flex: 1, background: "rgba(30,20,10,0.45)", backdropFilter: "blur(2px)" }}
          />
          <div
            onClick={(e) => e.stopPropagation()}
            className={menuClosing ? "menu-panel-exit" : "menu-panel-enter"}
            style={{
              width: 272,
              height: "100%",
              background: "var(--panel)",
              borderLeft: "1px solid var(--line)",
              boxShadow: "-14px 0 40px rgba(60,40,20,0.22)",
              padding: "26px 20px",
              display: "flex",
              flexDirection: "column",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
              <div style={{ width: 38, height: 38, borderRadius: 19, background: "var(--soft)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="castle" size={20} color="var(--gold)" />
              </div>
              <div style={{ display: "flex", flexDirection: "column" }}>
                <span style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 18, color: "var(--ink)", lineHeight: 1.2 }}>
                  {t.appName}
                </span>
                <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 10.5, color: "var(--muted2)" }}>
                  {t.tagline}
                </span>
              </div>
            </div>
            <div style={{ height: 1, background: "var(--line)", marginBottom: 16 }} />
            <div style={{ flex: 1, overflowY: "auto", overflowX: "hidden", marginRight: -6, paddingRight: 6 }}>
            {menuItems.map((it, idx) => (
              <button
                key={it.key}
                className="menu-item-enter"
                style={{
                  animationDelay: `${0.05 + idx * 0.05}s`,
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                  background: "none",
                  border: "none",
                  padding: "13px 12px",
                  borderRadius: 12,
                  cursor: "pointer",
                  fontFamily: "'Cairo', sans-serif",
                  fontSize: 14.5,
                  fontWeight: 600,
                  color: "var(--ink)",
                  textAlign: "right",
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--soft)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "none"; }}
                onClick={() => runMenuAction(it.action)}
              >
                <Icon name={it.icon} size={19} color="var(--gold)" />
                <span style={{ flex: 1 }}>{it.label}</span>
                {it.key === "dark" ? (
                  <span style={{ width: 40, height: 24, borderRadius: 12, background: dark ? "var(--gold)" : "var(--line)", position: "relative", display: "inline-flex", flexShrink: 0, transition: "background 0.25s ease" }}>
                    <span style={{ position: "absolute", top: 2.5, right: dark ? 2.5 : 21.5, width: 19, height: 19, borderRadius: 10, background: "var(--card)", boxShadow: "0 1px 3px rgba(0,0,0,0.3)", transition: "right 0.25s ease" }} />
                  </span>
                ) : (
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c5b8a4" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M9 6l6 6-6 6" />
                  </svg>
                )}
              </button>
            ))}
            </div>
            <div style={{ height: 1, background: "var(--line)", marginBottom: 14 }} />
            {ownerPrompt ? (
              <div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 8 }}>
                  <Icon name="lock" size={13} color="var(--gold)" />
                  <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 11, color: "var(--ink)", fontWeight: 700 }}>{t.ownerTitle}</span>
                </div>
                <p style={{ margin: "0 0 8px", fontFamily: "'Cairo', sans-serif", fontSize: 11, color: "var(--muted2)", textAlign: "center", lineHeight: 1.6 }}>{t.ownerDesc}</p>
                <input
                  value={ownerCode}
                  onChange={(e) => { setOwnerCode(e.target.value); setOwnerErr(false); }}
                  onKeyDown={(e) => { if (e.key === "Enter") submitOwner(); }}
                  placeholder={t.ownerPlaceholder}
                  style={{ width: "100%", background: "var(--soft)", border: "1px solid " + (ownerErr ? "#d54a4a" : "var(--line)"), borderRadius: 10, padding: "10px 12px", fontFamily: "'Cairo', sans-serif", fontSize: 13, color: "var(--ink)", boxSizing: "border-box", outline: "none", marginBottom: 8, textAlign: "center" }}
                />
                {ownerErr && <p style={{ margin: "0 0 8px", fontFamily: "'Cairo', sans-serif", fontSize: 11, color: "#d54a4a", textAlign: "center" }}>{t.ownerErr}</p>}
                <button onClick={submitOwner} style={{ width: "100%", background: "var(--accent)", color: "var(--bg)", border: "none", borderRadius: 10, padding: "10px 0", fontFamily: "'Cairo', sans-serif", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>{t.ownerActivate}</button>
              </div>
            ) : (
              <button
                onClick={handleOwnerTap}
                style={{ margin: 0, fontFamily: "'Cairo', sans-serif", fontSize: 11, color: "var(--muted2)", textAlign: "center", background: "none", border: "none", cursor: "pointer", padding: "4px 12px", lineHeight: 1.5 }}
              >
                {t.version}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function LandmarksScreen({ onBack, onNavigate, favorites, onToggleFav, lang = "ar" }) {
  const t = L[lang];
  const [activeCat, setActiveCat] = useState("all");
  const [showAll, setShowAll] = useState(false);
  const [hoverCat, setHoverCat] = useState(null);
  const [selected, setSelected] = useState(null);
  const [introLeaving, setIntroLeaving] = useState(false);
  const [introGone, setIntroGone] = useState(false);
  const filtered = activeCat === "all" ? LANDMARKS : LANDMARKS.filter((lm) => lm.category === activeCat);

  useEffect(() => {
    const t1 = setTimeout(() => setIntroLeaving(true), 3400);
    const t2 = setTimeout(() => setIntroGone(true), 4200);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  if (selected) {
    return (
      <LandmarkDetailView
        selected={selected}
        onBack={() => setSelected(null)}
        isFav={favorites.includes(selected.key)}
        onToggleFav={onToggleFav}
        onNavigate={onNavigate}
        activeNav="home"
        lang={lang}
      />
    );
  }

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: "var(--bg)", position: "relative" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "18px 18px 10px" }}>
        <BackButton onClick={onBack} />
        <h2 style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 18, color: "var(--ink)", margin: 0 }}>
          {t.landmarks}
        </h2>
        <button
          onClick={() => setShowAll(true)}
          style={{
            marginRight: "auto",
            display: "flex",
            alignItems: "center",
            gap: 6,
            background: showAll ? "var(--accent)" : "var(--soft)",
            border: showAll ? "1px solid var(--accent)" : "1px solid var(--line)",
            borderRadius: 20,
            padding: "7px 14px",
            cursor: "pointer",
            fontFamily: "'Cairo', sans-serif",
            fontSize: 12.5,
            fontWeight: 700,
            color: showAll ? "var(--onaccent)" : "var(--ink)",
            transition: "background 0.25s ease, border 0.25s ease, color 0.25s ease",
          }}
        >
          <Icon name="grid" size={15} color={showAll ? "var(--onaccent)" : "var(--gold)"} />
          <span>{t.showAllLandmarks}</span>
        </button>
      </div>

      <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "4px 18px 12px", flexShrink: 0 }}>
        {SUB_CATEGORIES.map((sc) => {
          const isActive = sc.key === activeCat;
          return (
            <button
              key={sc.key}
              onClick={() => { setShowAll(false); setActiveCat(sc.key); }}
              style={{
                flexShrink: 0,
                display: "flex",
                alignItems: "center",
                gap: 6,
                padding: "8px 14px",
                borderRadius: 20,
                border: isActive ? "1px solid var(--accent)" : "1px solid var(--line)",
                background: isActive ? "var(--accent)" : "var(--card)",
                cursor: "pointer",
                whiteSpace: "nowrap",
              }}
            >
              <Icon name={sc.icon} size={15} color={isActive ? "var(--onaccent)" : "var(--gold)"} />
              <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 12.5, fontWeight: 600, color: isActive ? "var(--onaccent)" : "var(--ink)" }}>
                {pick(lang, sc.label, SUB_EN, sc.key)}
              </span>
            </button>
          );
        })}
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "10px 16px 18px" }}>
        {showAll ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "16px 12px" }}>
            {LANDMARKS.map((lm) => (
              <LandmarkCard
                key={lm.key}
                lm={lm}
                onClick={() => setSelected(lm)}
                isFav={favorites.includes(lm.key)}
                onToggleFav={onToggleFav}
                lang={lang}
              />
            ))}
          </div>
        ) : activeCat === "all" ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "16px 12px" }}>
            {SUB_CATEGORIES.filter((sc) => sc.key !== "all").map((sc) => {
              const count = LANDMARKS.filter((lm) => lm.category === sc.key).length;
              const isHov = hoverCat === sc.key;
              return (
                <button
                  key={sc.key}
              onClick={() => { setShowAll(false); setActiveCat(sc.key); }}
                  onMouseEnter={() => setHoverCat(sc.key)}
                  onMouseLeave={() => setHoverCat(null)}
                  style={{
                    position: "relative",
                    borderRadius: 16,
                    overflow: "hidden",
                    aspectRatio: "3 / 2",
                    cursor: "pointer",
                    border: "1px solid rgba(0,0,0,0.08)",
                    padding: 0,
                    textAlign: "left",
                    transform: isHov ? "scale(1.06)" : "scale(1)",
                    boxShadow: isHov ? "0 14px 30px rgba(232,201,138,0.4)" : "0 4px 12px rgba(0,0,0,0.22)",
                    filter: isHov ? "drop-shadow(0 0 10px rgba(232,201,138,0.55))" : "none",
                    transition: "transform 0.35s cubic-bezier(0.22, 1.5, 0.36, 1), box-shadow 0.3s ease, filter 0.3s ease",
                    zIndex: isHov ? 3 : 1,
                  }}
                >
                  <div style={{ position: "absolute", inset: 0, backgroundImage: "url(" + LANDMARK_CAT_BG[sc.key] + ")", backgroundSize: "cover", backgroundPosition: "center" }} />
                  <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.32) 55%, rgba(0,0,0,0.06))" }} />
                  <div style={{ position: "relative", display: "flex", flexDirection: "column", height: "100%", padding: 14, justifyContent: "space-between" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-start" }}>
                      <div style={{ width: 34, height: 34, borderRadius: 10, background: "rgba(255,255,255,0.22)", border: "1px solid rgba(255,255,255,0.4)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <Icon name={sc.icon} size={17} color="#ffffff" />
                      </div>
                    </div>
                    <div>
                      <h3 style={{ margin: 0, fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 15, color: "#fff", lineHeight: 1.35, textShadow: "0 2px 6px rgba(0,0,0,0.4)" }}>
                        {pick(lang, sc.label, SUB_EN, sc.key)}
                      </h3>
                      <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 4 }}>
                        <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 11, fontWeight: 700, color: "rgba(255,255,255,0.8)" }}>{count}</span>
                        <span style={{ color: "rgba(255,255,255,0.85)", fontSize: 13 }}>‹</span>
                      </div>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "16px 12px" }}>
            {filtered.map((lm) => (
              <LandmarkCard
                key={lm.key}
                lm={lm}
                onClick={() => setSelected(lm)}
                isFav={favorites.includes(lm.key)}
                onToggleFav={onToggleFav}
                lang={lang}
              />
            ))}
          </div>
        )}
      </div>

      <BottomNav active="home" onNavigate={onNavigate} lang={lang} />

      {!introGone && (
        <div
          className={`map-intro${introLeaving ? " leaving" : ""}`}
          style={{
            position: "absolute",
            inset: 0,
            zIndex: 50,
            background: "radial-gradient(circle at 50% 36%, rgba(232,201,138,0.18), rgba(14,18,32,0) 55%), #0e1220",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 14,
          }}
        >
          <svg
            width="82%"
            viewBox="0 0 420 200"
            fill="none"
            stroke="#e8c98a"
            strokeWidth="4.5"
            strokeLinecap="round"
            strokeLinejoin="round"
            style={{ overflow: "visible", filter: "drop-shadow(0 0 18px rgba(232,201,138,0.4))" }}
          >

      <div style={{ flex: 1, height: 1, background: "linear-gradient(90deg, rgba(208,164,104,0.55), transparent)" }} />
    </div>
  );
}

function GlassCard({ children, style, className = "", tilt = 9, aurora }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = "perspective(900px) rotateY(" + (px * tilt).toFixed(2) + "deg) rotateX(" + (-py * tilt).toFixed(2) + "deg) translateY(-3px)";
    el.style.setProperty("--gx", (e.clientX - r.left) + "px");
    el.style.setProperty("--gy", (e.clientY - r.top) + "px");
  };
  const onLeave = () => {
    const el = ref.current;
    if (el) { el.style.transform = ""; }
  };
  return (
    <div ref={ref} className={"glass-card " + className} onMouseMove={onMove} onMouseLeave={onLeave} style={style}>
      {aurora && <div className="g-bg-aurora" />}
      {children}
    </div>
  );
}

function GoldDust({ count = 12 }) {
  const parts = Array.from({ length: count }, (_, i) => ({
    left: (i * 37.7) % 100 + "%",
    top: (i * 23.3) % 100 + "%",
    size: 3 + (i % 3) * 2,
    delay: (i % 7) * 0.9 + "s",
    dur: 8 + (i % 5) * 3 + "s",
  }));
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
      {parts.map((p, i) => (
        <span key={i} className="dust" style={{ left: p.left, top: p.top, width: p.size, height: p.size, animationDelay: p.delay, animationDuration: p.dur }} />
      ))}
    </div>
  );
}

function AmbientBG({ children }) {
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
      <div className="light-bloom" style={{ width: 340, height: 340, top: "-14%", right: "-20%", animationDelay: "0s" }} />
      <div className="light-bloom" style={{ width: 280, height: 280, bottom: "-12%", left: "-18%", animationDelay: "2.5s" }} />
      <GoldDust count={14} />
      {children}
    </div>
  );
}

function useCountUp(target, dur = 900) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf;
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      setVal(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, dur]);
  return val;
}

const KARAK_LAT = 31.1847;
const KARAK_LNG = 35.7016;

function prayerTimesFor(lat, lng) {
  const RAD = Math.PI / 180;
  const now = new Date();
  const tz = 3;
  const jd0 = Math.floor(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000) + 2440587.5;
  const jd = jd0 + (12 - tz) / 24;
  const n = jd - 2451545.0;
  const g = (357.529 + 0.98560028 * n) % 360;
  const q = (280.459 + 0.98564736 * n) % 360;
  const L = q + 1.915 * Math.sin(g * RAD) + 0.02 * Math.sin(2 * g * RAD);
  const e = 23.439 - 0.00000036 * n;
  const RA = (Math.atan2(Math.cos(e * RAD) * Math.sin(L * RAD), Math.cos(L * RAD)) / RAD + 360) % 360;
  const decl = Math.asin(Math.sin(e * RAD) * Math.sin(L * RAD)) / RAD;
  const EqT = (q - RA) / 15;
  const dhuhr = 12 + tz - lng / 15 - EqT;
  const cosH = (alt) => {
    const c = (Math.cos(alt * RAD) - Math.sin(lat * RAD) * Math.sin(decl * RAD)) / (Math.cos(lat * RAD) * Math.cos(decl * RAD));
    return Math.acos(Math.max(-1, Math.min(1, c))) / RAD / 15;
  };
  const asrAlt = Math.atan(1 / (Math.tan(Math.abs(lat - decl) * RAD) + 1)) / RAD;
  const wrap = (h) => ((h % 24) + 24) % 24;
  return [
    { key: "fajr", h: wrap(dhuhr - cosH(18)) },
    { key: "sunrise", h: wrap(dhuhr - cosH(90.833)) },
    { key: "dhuhr", h: wrap(dhuhr) },
    { key: "asr", h: wrap(dhuhr + cosH(asrAlt)) },
    { key: "maghrib", h: wrap(dhuhr + cosH(90.833)) },
    { key: "isha", h: wrap(dhuhr + cosH(17)) },
  ];
}

function fmtH(h, lang) {
  let total = ((h % 24) + 24) % 24;
  const mins = Math.round(total * 60);
  const isPM = mins >= 12 * 60;
  let hh = Math.floor(mins / 60) % 12;
  if (hh === 0) hh = 12;
  const mm = mins % 60;
  const pad = (x) => (x < 10 ? "0" + x : String(x));
  const sfx = lang === "ar" ? (isPM ? " م" : " ص") : (isPM ? " PM" : " AM");
  return hh + ":" + pad(mm) + " " + sfx;
}

    )
      .then((r) => r.json())
      .then((j) => {
        if (j && j.data && j.data.timings) setRemoteTimes(j.data.timings);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    const iv = setInterval(() => setTick((x) => x + 1), 1000);
    return () => clearInterval(iv);
  }, []);

  const parseT = (s) => {
    const p = String(s).split(":");
    return parseInt(p[0], 10) + parseInt(p[1], 10) / 60;
  };
  const items = remoteTimes
    ? [
        { key: "fajr", h: parseT(remoteTimes.Fajr) },
        { key: "sunrise", h: parseT(remoteTimes.Sunrise) },
        { key: "dhuhr", h: parseT(remoteTimes.Dhuhr) },
        { key: "asr", h: parseT(remoteTimes.Asr) },
        { key: "maghrib", h: parseT(remoteTimes.Maghrib) },
        { key: "isha", h: parseT(remoteTimes.Isha) },
      ]
    : prayerTimesFor(KARAK_LAT, KARAK_LNG);
  const names = [t.prayerFajr, t.prayerSunrise, t.prayerDhuhr, t.prayerAsr, t.prayerMaghrib, t.prayerIsha];
  const mins = items.map((it) => it.h * 60);
  const now = new Date(Date.now() + new Date().getTimezoneOffset() * 60000 + 3 * 3600000);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let nextIdx = -1;
  for (let i = 0; i < mins.length; i++) {
    if (mins[i] > nowMin) { nextIdx = i; break; }
  }
  let countdownSec;
  if (nextIdx === -1) {
    nextIdx = 0;
    countdownSec = Math.round((mins[0] + 1440 - nowMin) * 60);
  } else {
    countdownSec = Math.round((mins[nextIdx] - nowMin) * 60);
  }
  if (countdownSec < 0) countdownSec = 0;
  const pad = (x) => (x < 10 ? "0" + x : String(x));
  const ch = Math.floor(countdownSec / 3600);
  const cm = Math.floor((countdownSec % 3600) / 60);
  const cs = countdownSec % 60;
  const countdownText = (ch > 0 ? ch + ":" : "") + pad(cm) + ":" + pad(cs);

  const dateStr = new Date().toLocaleDateString(lang === "ar" ? "ar-JO" : "en-GB", { weekday: "long", day: "numeric", month: "long" });

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: "var(--bg)", position: "relative" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "18px 18px 10px" }}>
        <BackButton onClick={onBack} />
        <h2 style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 18, color: "var(--ink)", margin: 0 }}>
          {t.prayer}
        </h2>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "6px 18px 18px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 14, padding: "14px 16px", marginBottom: 14 }}>
          <div style={{ width: 44, height: 44, borderRadius: 22, background: "var(--soft)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name="mosque" size={24} color="var(--gold)" />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
            <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13, fontWeight: 700, color: "var(--ink)" }}>{dateStr}</span>
            <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 11.5, color: "var(--muted)" }}>{t.prayerSub}</span>
          </div>
        </div>

        <button
          onClick={() => onNavigate("adhkar")}
          style={{
            width: "100%",
            border: "none",
            cursor: "pointer",
            marginBottom: 14,
            backgroundImage: "url(adhkar/general.jpg)",
            backgroundSize: "cover",
            backgroundPosition: "center",
            borderRadius: 18,
            padding: "15px 18px",
            display: "flex",
            alignItems: "center",
            gap: 14,
            position: "relative",
            overflow: "hidden",
            boxShadow: "0 10px 26px rgba(20,60,45,0.35)",
          }}
        >
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to left, rgba(8,20,14,0.78), rgba(8,20,14,0.35))" }} />
          <div style={{ position: "relative", width: 48, height: 48, borderRadius: 24, background: "rgba(255,255,255,0.16)", border: "1px solid rgba(255,255,255,0.3)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name="beads" size={26} color="#ffffff" />
          </div>
          <div style={{ position: "relative", flex: 1, minWidth: 0, textAlign: lang === "ar" ? "right" : "left" }}>
            <span style={{ display: "block", fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 17.5, color: "#fffdf5" }}>{t.adhkarTitle}</span>
            <span style={{ display: "block", fontFamily: "'Cairo', sans-serif", fontSize: 11.5, color: "rgba(255,255,255,0.85)", marginTop: 2 }}>{t.adhkarSub}</span>
          </div>
          <span style={{ position: "relative", color: "#fffdf5", fontSize: 20, flexShrink: 0 }}>‹</span>
        </button>

        <div style={{ background: "linear-gradient(135deg, #6b4226 0%, var(--gold) 100%)", borderRadius: 18, padding: "20px 18px", marginBottom: 14, textAlign: "center", position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, background: "radial-gradient(circle at 50% 0%, rgba(232,201,138,0.28), rgba(0,0,0,0) 60%)" }} />
          <div style={{ position: "relative" }}>
            <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 12.5, fontWeight: 600, color: "#f7dfa0", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 6 }}>
              <span className="prayer-pulse">&#9679;</span>
              {t.prayerNext}
            </span>
            <div style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 27, color: "#fff3cf" }}>{names[nextIdx]}</div>
            <div style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 800, fontSize: 40, color: "var(--card)", letterSpacing: 1, direction: "ltr" }}>{fmtH(items[nextIdx].h, lang)}</div>
            <div style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13, fontWeight: 600, color: "#f7dfa0" }}>
              {t.prayerIn} <span className="prayer-count">{countdownText}</span>
            </div>
          </div>
        </div>

        <div style={{ border: "1px solid var(--line)", borderRadius: 16, background: "var(--card)", overflow: "hidden" }}>
          {items.map((it, i) => {
            const isNext = i === nextIdx;
            return (
              <div
                key={it.key}
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  padding: "14px 16px",
                  borderBottom: i === items.length - 1 ? "none" : "1px solid var(--line)",
                  background: isNext ? "var(--soft)" : "transparent",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 9, height: 9, borderRadius: 5, background: isNext ? "var(--gold)" : "var(--muted2)", flexShrink: 0 }} />
                  <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 14.5, fontWeight: 700, color: "var(--ink)" }}>{names[i]}</span>
                </div>
                <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 15, fontWeight: 800, color: isNext ? "var(--gold)" : "var(--muted)", direction: "ltr" }}>
                  {fmtH(it.h, lang)}
                </span>
              </div>
            );
          })}
        </div>
      </div>

      <BottomNav active="home" onNavigate={onNavigate} lang={lang} />

      {!gone && (
        <div
          className={`map-intro${leaving ? " leaving" : ""}`}
          style={{
            position: "absolute",
            inset: 0,
            zIndex: 50,
            background: "radial-gradient(circle at 50% 34%, rgba(232,201,138,0.2), rgba(14,18,32,0) 55%), #0e1220",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "flex-start",
            paddingTop: "5%",
            gap: 8,
          }}
        >
          <svg
            style={{ width: "min(44%, 200px)", overflow: "visible", filter: "drop-shadow(0 0 20px rgba(232,201,138,0.45))", flexShrink: 0 }}
            viewBox="0 0 200 200"
            fill="none"
            stroke="#e8c98a"
            strokeWidth="5"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path className="mosque-dome" d="M 72 170 L 72 106 C 72 74 128 74 128 106 L 128 170 Z" />
            <path className="mosque-minaret" d="M 45 170 L 45 64 Q 42 52 50 50 Q 58 52 55 64 L 55 170" />
            <path className="mosque-minaret" d="M 145 170 L 145 64 Q 142 52 150 50 Q 158 52 155 64 L 155 170" />
            <path className="mosque-door" d="M 90 170 L 90 142 C 90 132 110 132 110 142 L 110 170" />
            <path className="mosque-crescent" d="M 94 68 C 98 56 106 54 110 62" />
          </svg>

          <div className="map-title" style={{ textAlign: "center", pointerEvents: "none" }}>
            <span style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 34, color: "#e8c98a", textShadow: "0 0 22px rgba(232,201,138,0.55)" }}>
              {t.prayer}
            </span>
          </div>

          <div className="map-note-early" style={{ textAlign: "center", pointerEvents: "none" }}>
            <span style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "#cbb889" }}>
              {t.prayerSub}
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

const VAULT_KEY = "karak_vault";
const OWNER_KEY = "karak_owner";
const OWNER_CODE = "9189183072007";

const DataVault = {
  toB64(u8) { let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); },
  fromB64(s) { const bin = atob(s); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; },
  async derive(pass, salt) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
      km,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  },
  async lock(pass, payload) {
    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await DataVault.derive(pass, salt);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(payload)));
    return JSON.stringify({ v: 1, s: DataVault.toB64(salt), i: DataVault.toB64(iv), d: DataVault.toB64(new Uint8Array(ct)) });
  },
  async unlock(pass, vaultStr) {
    const o = JSON.parse(vaultStr);
    const key = await DataVault.derive(pass, DataVault.fromB64(o.s));
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: DataVault.fromB64(o.i) }, key, DataVault.fromB64(o.d));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  hasVault() {
    try { return !!localStorage.getItem(VAULT_KEY); } catch { return false; }
  },
  supported() {
    return typeof window !== "undefined" && !!window.crypto && !!crypto.subtle;
  },
};

function LockModal({ t, onClose, alreadyLocked, onLock, onRelock }) {
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  const submit = async () => {
    if (!DataVault.supported()) { setErr(t.lockUnavailable); return; }
    if (p1.length < 4) { setErr(t.lockMin); return; }
    if (p1 !== p2) { setErr(t.lockMismatch); return; }
    setBusy(true); setErr("");
    const ok = await onLock(p1);
    setBusy(false);
    if (ok) setDone(true); else setErr(t.lockUnavailable);
  };

  return (
    <div style={{ position: "absolute", inset: 0, zIndex: 90, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>

            <button onClick={onClose} style={{ background: "var(--accent)", color: "var(--bg)", border: "none", borderRadius: 12, padding: "12px 0", width: "100%", fontFamily: "'Cairo', sans-serif", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>{t.close}</button>

            <h3 style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 23, color: "var(--ink)", margin: "0 0 6px" }}>{t.lockTitle}</h3>
            <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "var(--muted)", margin: "0 0 18px", lineHeight: 1.7 }}>{t.lockedNotice} ✓</p>

              <Icon name="lock" size={30} color="var(--gold)" />
            </div>
            <h3 style={{ fontFamily: "'Amiri', serif", fontWeight: 700, fontSize: 23, color: "var(--ink)", margin: "0 0 6px" }}>{t.lockTitle}</h3>
            <p style={{ fontFamily: "'Cairo', sans-serif", fontSize: 13.5, color: "var(--muted)", margin: "0 0 16px", lineHeight: 1.7 }}>{t.lockDesc}</p>

  const [lockOpen, setLockOpen] = useState(false);
  const passRef = useRef(null);
  const [installOpen, setInstallOpen] = useState(false);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const deferredRef = useRef(null);

  const t = L[lang];

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); deferredRef.current = e; };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  const doInstall = () => {
    const d = deferredRef.current;
    if (d) {
      d.prompt();
      if (d.userChoice) d.userChoice.then(() => { deferredRef.current = null; });
    } else {
      setInstallOpen(true);
    }
  };

  const toggleDark = () => {
    setDark((prev) => {
      if (!locked) {
        try { localStorage.setItem("karak_dark", prev ? "0" : "1"); } catch {}
      }
      return !prev;
    });
  };

  useEffect(() => {
    try {
      document.documentElement.classList.toggle("theme-dark", dark);
    } catch {}
  }, [dark]);

  const toggleLang = (next) => {
    const nl = next || (lang === "ar" ? "en" : "ar");
    setLang(nl);
    if (!locked) {
      try { localStorage.setItem("karak_lang", nl); } catch {}
    }
  };

  useEffect(() => {
    if (!locked) {
      try { localStorage.setItem("karak_favorites", JSON.stringify(favorites)); } catch {}
      return;
    }
    if (unlocked && passRef.current) {
      DataVault.lock(passRef.current, { favorites, lang, dark }).then((v) => {
        try { localStorage.setItem(VAULT_KEY, v); } catch {}
      });
    }
  }, [favorites, locked, unlocked, lang, dark]);

  const lockData = async (pass) => {
    try {
      if (!DataVault.supported()) return false;
      const payload = { favorites, lang, dark };
      const vault = await DataVault.lock(pass, payload);
      localStorage.setItem(VAULT_KEY, vault);
      localStorage.removeItem("karak_favorites");
      localStorage.removeItem("karak_lang");
      localStorage.removeItem("karak_dark");
      passRef.current = pass;
      setLocked(true);
      setUnlocked(true);
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  };

  const unlockData = async (pass) => {
    try {
      if (!DataVault.supported()) return false;
      const payload = await DataVault.unlock(pass, localStorage.getItem(VAULT_KEY));
      setFavorites(payload.favorites || []);
      setLang(payload.lang || "ar");
      setDark(!!payload.dark);
      passRef.current = pass;
      setUnlocked(true);
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  };

  const relockData = () => {
    setUnlocked(false);
  };

  const toggleFav = (key) => {
    setFavorites((prev) =>
      prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]
    );
  };

  useEffect(() => {
    const t1 = setTimeout(() => setSplashLeaving(true), 3200);
    const t2 = setTimeout(() => setSplash(false), 3900);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  const navigate = (next) => {
    if (next === screen || phase === "exit") return;
    setPhase("exit");
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      setScreen(next);
      setPhase("enter");
    }, 220);
  };

  useEffect(() => () => clearTimeout(timerRef.current), []);

  return (
    <div dir={lang === "ar" ? "rtl" : "ltr"} className={dark ? "theme-dark" : "theme-light"} style={{ minHeight: "100vh", display: "flex", alignItems: "stretch", justifyContent: "center", background: "#0e1220", padding: 0 }}>
      <style>{FONT_IMPORT}</style>
      <style>{SCREEN_ANIM_CSS}</style>
      <style>{THEME_CSS}</style>
      <div
        style={{
          width: "100%",
          height: "100vh",
          minHeight: "100vh",
          background: "#000",
          position: "relative",
          overflow: "hidden",
          display: "flex",
          justifyContent: "center",
        }}
      >
        <div
          key={screen}
          className={phase === "exit" ? "screen-exit" : "screen-enter"}
          style={{
            position: "relative",
            width: "100%",
            maxWidth: 1180,
            height: "100%",
            background: "#0e1220",
          }}
        >
          {screen === "home" && <HomeScreen onDiscover={() => navigate("categories")} onNavigate={navigate} lang={lang} onSuggest={() => setSuggestOpen(true)} />}
          {screen === "categories" && (
            <CategoriesScreen
              onHome={() => navigate("home")}
              onNavigate={navigate}
               onOpenCategory={(key) => {
                 if (key === "landmarks") navigate("landmarks");
                 if (key === "figures") navigate("figures");
                 if (key === "tribes") navigate("tribes");
                 if (key === "mutah") navigate("mutah");
                 if (key === "sports") navigate("sports");
                 if (key === "prayer") navigate("prayer");
               }}
              lang={lang}
              onToggleLang={toggleLang}
              dark={dark}
              onToggleDark={toggleDark}
              onInstall={doInstall}
              onSuggest={() => setSuggestOpen(true)}
              onLockRequest={() => setLockOpen(true)}
            />
          )}
          {screen === "landmarks" && (
            <LandmarksScreen
              onBack={() => navigate("categories")}
              onNavigate={navigate}
              favorites={favorites}
              onToggleFav={toggleFav}
              lang={lang}
            />
          )}
          {screen === "figures" && (
            <FiguresScreen onBack={() => navigate("categories")} onNavigate={navigate} lang={lang} />
          )}
          {screen === "tribes" && (
            <TribesScreen onBack={() => navigate("categories")} onNavigate={navigate} lang={lang} />
          )}
          {screen === "mutah" && (
            <MutahScreen onBack={() => navigate("categories")} onNavigate={navigate} lang={lang} />
          )}
          {screen === "sports" && (
            <SportsScreen onBack={() => navigate("categories")} onNavigate={navigate} lang={lang} />
          )}
          {screen === "prayer" && (
            <PrayerScreen onBack={() => navigate("categories")} onNavigate={navigate} lang={lang} />
          )}
          {screen === "adhkar" && (
            <AdhkarScreen onBack={() => navigate("prayer")} lang={lang} />
          )}
          {screen === "search" && (
            <SearchScreen
              onBack={() => navigate("categories")}
              onNavigate={navigate}
              favorites={favorites}
              onToggleFav={toggleFav}
              lang={lang}
            />
          )}
          {screen === "favorites" && (
            <FavoritesScreen
              onBack={() => navigate("home")}
              onNavigate={navigate}
              favorites={favorites}
              onToggleFav={toggleFav}
              lang={lang}
            />
          )}
          {screen === "settings" && (
            <SettingsScreen onBack={() => navigate("home")} onNavigate={navigate} lang={lang} onToggleLang={toggleLang} dark={dark} onToggleDark={toggleDark} onSuggest={() => setSuggestOpen(true)} />
          )}
          {screen === "map" && (
            <MapScreen onBack={() => navigate("home")} onNavigate={navigate} lang={lang} />
          )}
        </div>
        {splash && <SplashScreen leaving={splashLeaving} lang={lang} onClick={() => setSplash(false)} />}
        {installOpen && <InstallModal t={t} onClose={() => setInstallOpen(false)} />}
        {suggestOpen && <SuggestionModal t={t} onClose={() => setSuggestOpen(false)} />}
        {locked && !unlocked && <UnlockOverlay t={t} onUnlock={unlockData} />}
        {lockOpen && !splash && (
          <LockModal t={t} onClose={() => setLockOpen(false)} alreadyLocked={locked && unlocked} onLock={lockData} onRelock={relockData} />
        )}
      </div>
    </div>
  );
}
  </script>
  <script type="text/babel" data-presets="react">
    try {
      ReactDOM.createRoot(document.getElementById("root")).render(<KarakApp />);
    } catch (err) {
      document.getElementById("root").innerHTML = '<div style="padding:30px;color:red;background:white;font-family:sans-serif;direction:ltr;z-index:999999;position:relative;"><h3>React Mount Error:</h3><pre>' + err.message + '</pre></div>';
      console.error(err);
    }
  </script>
</body>
</html>
